name: Publish NuGet package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

env:
  DOTNET_NOLOGO: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use the vMAJOR.MINOR.PATCH[-prerelease] format: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore HierarchyKit.slnx

      - name: Build and test
        run: dotnet test Tests/HierarchyKit.Tests/HierarchyKit.Tests.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/HierarchyKit/HierarchyKit.csproj --configuration Release --no-restore --output ./artifacts/packages -p:PackageVersion=${{ steps.version.outputs.value }}

      - name: Log in to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1

      - name: Publish package
        run: dotnet nuget push "./artifacts/packages/HierarchyKit.${{ steps.version.outputs.value }}.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source "$NUGET_SOURCE" --skip-duplicate

      - name: Publish symbols package
        run: dotnet nuget push "./artifacts/packages/HierarchyKit.${{ steps.version.outputs.value }}.snupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source "$NUGET_SOURCE" --skip-duplicate

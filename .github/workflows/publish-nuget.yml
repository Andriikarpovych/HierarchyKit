name: Publish NuGet package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use the vMAJOR.MINOR.PATCH[-prerelease] format: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore HierarchyKit.slnx

      - name: Build and test
        run: dotnet test Tests/HierarchyKit.Tests/HierarchyKit.Tests.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/HierarchyKit/HierarchyKit.csproj --configuration Release --no-restore --output ./artifacts/packages -p:PackageVersion=${{ steps.version.outputs.value }}

      - name: Publish package
        run: dotnet nuget push "./artifacts/packages/*.nupkg" --api-key "$NUGET_API_KEY" --source "$NUGET_SOURCE" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Publish symbols package
        run: dotnet nuget push "./artifacts/packages/*.snupkg" --api-key "$NUGET_API_KEY" --source "$NUGET_SOURCE" --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
